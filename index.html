<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming and ensures edge-to-edge scaling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Notes</title>
    <style>
        /* Reset and edge-to-edge styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            overflow: hidden; /* Prevent accidental scrolling of the whole page */
            touch-action: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Top 70% Note Area */
                textarea.note-area {
                    flex: 7; /* Takes up 70% of the flexbox */
                    padding: 24px;
                    box-sizing: border-box;
                    font-size: 1.4rem;
                    line-height: 1.6;
                    color: #333;
                    overflow-y: auto; /* Allows scrolling if notes get too long */
                    background: #ffffff;
                    border: none;
                    border-bottom: 2px solid #e5e5ea;
                    resize: none;
                    outline: none;
                    font-family: inherit;
                }

        /* Bottom 30% Keyboard Area */
        .keyboard {
            flex: 3; /* Takes up 30% of the flexbox */
            background: #d1d5db;
            display: flex;
            flex-direction: column;
            padding: 6px;
            box-sizing: border-box;
            gap: 6px;
            justify-content: center;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            flex: 1;
            gap: 6px;
        }

        .key {
            flex: 1;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }

        .key:active {
            background: #9ca3af;
        }

        /* Special key sizings */
                .key.wide {
                    flex: 1.5;
                    background: #a3aab6;
                }
                .key.space {
                    flex: 5; /* Adjusted to perfect Gboard proportions */
                }
            </style>
</head>
<body>

    <div class="app-container">
        <!-- Display area for notes (using textarea to allow cursor placement and clicking) -->
                <textarea id="note-area" class="note-area" inputmode="none" placeholder="Tap anywhere to start typing..."></textarea>
        
        <!-- Always-on virtual keyboard -->
        <div class="keyboard" id="keyboard"></div>
    </div>

    <script>
                const noteArea = document.getElementById('note-area');
                let isShift = false;
        
                // True Gboard Layout (Properly aligned with spacers)
                const layout = [
                    ['1','2','3','4','5','6','7','8','9','0'],
                    ['q','w','e','r','t','y','u','i','o','p'],
                    ['spacer', 'a','s','d','f','g','h','j','k','l', 'spacer'],
                    ['Shift','z','x','c','v','b','n','m','Bksp'],
                    ['?123', ',', 'Space', '.', 'Enter']
                ];
        
                const keyboardDiv = document.getElementById('keyboard');
        
                // Generate Keyboard DOM
                layout.forEach(rowKeys => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'keyboard-row';
                    
                    rowKeys.forEach(key => {
                        if (key === 'spacer') {
                            const spacer = document.createElement('div');
                            spacer.style.flex = "0.5";
                            rowDiv.appendChild(spacer);
                            return; // Skip adding a button for the spacer
                        }
    
                        const btn = document.createElement('button');
                        btn.className = 'key';
                        // Use a clean icon for Backspace, otherwise use the normal key text
                        btn.textContent = key === 'Bksp' ? '⌫' : key;
                        
                        if (key === 'Shift' || key === 'Bksp' || key === '?123' || key === 'Enter') {
                            btn.classList.add('wide');
                        }
                        if (key === 'Space') {
                            btn.classList.add('space');
                        }
                        
                        // Use pointerdown to handle both mouse clicks and mobile touches instantly
                        btn.addEventListener('pointerdown', (e) => {
                            e.preventDefault(); // Crucial: Prevents button from stealing focus from the textarea cursor
                            handleInput(key);
                        });
        
                        rowDiv.appendChild(btn);
                    });
                    keyboardDiv.appendChild(rowDiv);
                });
        
                // Function to process character input at cursor position
                function handleInput(key) {
                    noteArea.focus(); // Ensure textarea is active
                    const start = noteArea.selectionStart;
                    const end = noteArea.selectionEnd;
                    const val = noteArea.value;
                    let textToInsert = "";
        
                    if (key === 'Bksp') {
                        if (start === end && start > 0) {
                            noteArea.value = val.substring(0, start - 1) + val.substring(end);
                            noteArea.selectionStart = noteArea.selectionEnd = start - 1;
                        } else if (start !== end) {
                            noteArea.value = val.substring(0, start) + val.substring(end);
                            noteArea.selectionStart = noteArea.selectionEnd = start;
                        }
                        return; // Skip the insertion step
                    } else if (key === 'Space') {
                        textToInsert = " ";
                    } else if (key === 'Enter') {
                        textToInsert = "\n";
                    } else if (key === 'Shift') {
                        isShift = !isShift;
                        return; // Toggle shift and exit
                    } else if (key === '?123') {
                        return; // Dummy key to match Gboard visuals, functionality can be added later
                    } else {
                        textToInsert = isShift ? key.toUpperCase() : key;
                        if (isShift) isShift = false; // Auto-turn off shift after one letter
                    }
        
                    // Insert exactly at current cursor position
                    noteArea.value = val.substring(0, start) + textToInsert + val.substring(end);
                    noteArea.selectionStart = noteArea.selectionEnd = start + textToInsert.length;
                }
        
                // Native textarea handles physical keyboard out-of-the-box, no event listener needed!
            </script>
</body>
</html>
