<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming and ensures edge-to-edge scaling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Notes</title>
    <style>
            @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap');
    
            /* Reset and edge-to-edge styling */
            body, html {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                font-family: 'Roboto Mono', monospace; /* Emergency/Terminal vibe */
                background-color: #000000; /* Pure black background */
                overflow: hidden; 
                touch-action: none;
            }
    
            .app-container {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
            }
    
            /* Top 70% Note Area */
            textarea.note-area {
                flex: 7; 
                padding: 24px;
                box-sizing: border-box;
                font-size: 1.6rem;
                font-weight: bold;
                line-height: 1.6;
                color: #ff0000; /* Red text */
                background: #000000; /* Black background */
                border: none;
                border-bottom: 2px solid #ff0000; /* Red border */
                resize: none;
                outline: none;
                font-family: inherit;
                caret-color: #ff0000; /* Native red blinking cursor */
            }
    
            textarea.note-area::placeholder {
                color: #770000; /* Darker red for placeholder */
            }
    
            /* Bottom 30% Keyboard Area */
            .keyboard {
                flex: 3; 
                background: #000000; /* Black keyboard background */
                display: flex;
                flex-direction: column;
                padding: 6px;
                box-sizing: border-box;
                gap: 6px;
                justify-content: center;
            }
    
            .keyboard-row {
                display: flex;
                justify-content: center;
                flex: 1;
                gap: 6px;
            }
    
            .key {
                        flex: 1;
                        background: #000000; /* Black keys */
                        color: #ff0000; /* Red text */
                        border: 1px solid #ff0000; /* Red borders for visibility */
                        border-radius: 6px;
                        font-size: 1.3rem;
                        font-weight: bold;
                        cursor: pointer;
                        box-shadow: 0 0 5px rgba(255, 0, 0, 0.3); /* Subtle red glow */
                        user-select: none;
                        -webkit-tap-highlight-color: transparent;
                        transition: all 0.1s;
                        font-family: 'Roboto Mono', monospace;
                    }
    
            .key:active {
                background: #ff0000; /* Solid red when pressed */
                color: #000000; /* Black text when pressed */
                box-shadow: 0 0 15px rgba(255, 0, 0, 0.8); /* Intense glow on press */
            }
    
            /* Special key sizings */
            .key.wide {
                flex: 1.5;
                background: #110000; /* Very slightly tinted dark red for wide keys */
            }
            .key.space {
                flex: 5;
            }
        </style>
</head>
<body>

    <div class="app-container">
            <!-- Display area for notes (with floating delete button) -->
            <div style="flex: 7; display: flex; flex-direction: column; position: relative;">
                <button id="delete-btn" style="position: absolute; top: 16px; right: 24px; background: #000000; color: #ff0000; border: 1px solid #ff0000; padding: 6px 12px; font-family: 'Roboto Mono', monospace; font-weight: bold; cursor: pointer; border-radius: 4px; box-shadow: 0 0 5px rgba(255, 0, 0, 0.3); z-index: 10;">⌫ DELETE</button>
                <textarea id="note-area" class="note-area" style="flex: 1; width: 100%; height: 100%;" inputmode="none" placeholder="Tap anywhere to start typing..."></textarea>
            </div>
            
            <!-- Always-on virtual keyboard -->
            <div class="keyboard" id="keyboard"></div>
        </div>

    <script type="module">
                        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
                        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAYHA8Qw3Qw3Qzbyg8MtjrSKcJusNi4VaA6V4",
                            authDomain: "system-data-bf026.firebaseapp.com",
                            databaseURL: "https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "system-data-bf026",
                            storageBucket: "system-data-bf026.firebasestorage.app",
                            messagingSenderId: "718302899022",
                            appId: "1:718302899022:web:f1675dbcc293e138c68c1f"
                        };
                        const app = initializeApp(firebaseConfig);
                        const db = getDatabase(app);
                        const noteRef = ref(db, 'terminalKeyboardApp/note');
                
                        const noteArea = document.getElementById('note-area');
                        const deleteBtn = document.getElementById('delete-btn');
                        let isShift = false;
                    let isSymbols = false;
                    
                    // Primary Letters Layout
                    const layoutLetters = [
                        ['1','2','3','4','5','6','7','8','9','0'],
                        ['q','w','e','r','t','y','u','i','o','p'],
                        ['spacer', 'a','s','d','f','g','h','j','k','l', 'spacer'],
                        ['Shift','z','x','c','v','b','n','m','Bksp'],
                        ['!#1', ',', 'Space', '.', 'Enter']
                    ];
        
                    // Secondary Symbols Layout
                    const layoutSymbols = [
                        ['1','2','3','4','5','6','7','8','9','0'],
                        ['@','#','$','%','&','-','+','(',')','*'],
                        ['spacer', '"','\'',':',';','!','?','/','~', 'spacer'],
                        ['ABC','_','\\','|','<','>','{','}','Bksp'],
                        ['ABC', ',', 'Space', '.', 'Enter']
                    ];
            
                    const keyboardDiv = document.getElementById('keyboard');
            
                    // Generate Keyboard DOM Dynamically
                    function renderKeyboard() {
                        keyboardDiv.innerHTML = ''; // Clear existing keyboard
                        const currentLayout = isSymbols ? layoutSymbols : layoutLetters;
                        
                        currentLayout.forEach(rowKeys => {
                            const rowDiv = document.createElement('div');
                            rowDiv.className = 'keyboard-row';
                            
                            rowKeys.forEach(key => {
                                if (key === 'spacer') {
                                    const spacer = document.createElement('div');
                                    spacer.style.flex = "0.5";
                                    rowDiv.appendChild(spacer);
                                    return; // Skip adding a button for the spacer
                                }
        
                                const btn = document.createElement('button');
                                btn.className = 'key';
                                
                                // Match the visual icons/text
                                                            if (key === 'Shift') btn.textContent = '⇧';
                                                            else if (key === 'Bksp') btn.textContent = '⌫';
                                                            else if (key === 'Space') btn.textContent = ''; // Hidden spacebar text
                                                            else if (key === 'Enter') btn.textContent = '↵';
                                                            else if (key === 'ABC' || key === '!#1') btn.textContent = key;
                                                            else btn.textContent = (isShift && !isSymbols) ? key.toUpperCase() : key;
                                
                                if (key === 'Shift' || key === 'Bksp' || key === '!#1' || key === 'ABC' || key === 'Enter') {
                                    btn.classList.add('wide');
                                }
                                if (key === 'Space') {
                                    btn.classList.add('space');
                                }
                                
                                // Use pointerdown to handle both mouse clicks and mobile touches instantly
                                btn.addEventListener('pointerdown', (e) => {
                                    e.preventDefault(); // Crucial: Prevents button from stealing focus from the textarea cursor
                                    handleInput(key);
                                });
                
                                rowDiv.appendChild(btn);
                            });
                            keyboardDiv.appendChild(rowDiv);
                        });
                    }
        
                    renderKeyboard(); // Render the keyboard immediately on load
            
                    // Function to process character input at cursor position
                    function handleInput(key) {
                        noteArea.focus(); // Ensure textarea is active
                        const start = noteArea.selectionStart;
                        const end = noteArea.selectionEnd;
                        const val = noteArea.value;
                        let textToInsert = "";
            
                        if (key === 'Bksp') {
                            if (start === end && start > 0) {
                                noteArea.value = val.substring(0, start - 1) + val.substring(end);
                                noteArea.selectionStart = noteArea.selectionEnd = start - 1;
                            } else if (start !== end) {
                                noteArea.value = val.substring(0, start) + val.substring(end);
                                noteArea.selectionStart = noteArea.selectionEnd = start;
                            }
                            return; // Skip the insertion step
                        } else if (key === 'Space') {
                            textToInsert = " ";
                        } else if (key === 'Enter') {
                            textToInsert = "\n";
                        } else if (key === 'Shift') {
                            isShift = !isShift;
                            renderKeyboard(); // Re-render to show uppercase/lowercase keys
                            return; // Toggle shift and exit
                        } else if (key === '!#1' || key === 'ABC') {
                            isSymbols = !isSymbols; // Toggle layout state
                            if (isSymbols) isShift = false; // Reset shift when opening symbols
                            renderKeyboard(); // Re-render with new layout
                            return;
                        } else {
                            textToInsert = (isShift && !isSymbols) ? key.toUpperCase() : key;
                            if (isShift) {
                                isShift = false; // Auto-turn off shift after one letter
                                renderKeyboard(); // Re-render back to lowercase
                            }
                        }
            
                        // Insert exactly at current cursor position
                                                noteArea.value = val.substring(0, start) + textToInsert + val.substring(end);
                                                noteArea.selectionStart = noteArea.selectionEnd = start + textToInsert.length;
                                                
                                                // Push to Firebase instantly
                                                set(noteRef, { text: noteArea.value });
                                            }
                                    
                                            // Delete button logic
                                            deleteBtn.addEventListener('pointerdown', (e) => {
                                                e.preventDefault();
                                                noteArea.value = '';
                                                set(noteRef, { text: '' });
                                                noteArea.focus();
                                            });
                                    
                                            // Keep note alive with remote Firebase changes
                                            onValue(noteRef, (snapshot) => {
                                                const data = snapshot.val();
                                                if (data && typeof data.text === 'string') {
                                                    if (noteArea.value !== data.text) {
                                                        noteArea.value = data.text;
                                                    }
                                                }
                                            });
                                        </script>
</body>
</html>
