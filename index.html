<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming and ensures edge-to-edge scaling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Notes</title>
    <style>
        /* Reset and edge-to-edge styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            overflow: hidden; /* Prevent accidental scrolling of the whole page */
            touch-action: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        /* Top 70% Note Area */
        .note-area {
            flex: 7; /* Takes up 70% of the flexbox */
            padding: 24px;
            box-sizing: border-box;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #333;
            overflow-y: auto; /* Allows scrolling if notes get too long */
            background: #ffffff;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-bottom: 2px solid #e5e5ea;
        }

        /* Simulated Blinking Cursor */
        .note-area::after {
            content: '|';
            color: #007aff;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Bottom 30% Keyboard Area */
        .keyboard {
            flex: 3; /* Takes up 30% of the flexbox */
            background: #d1d5db;
            display: flex;
            flex-direction: column;
            padding: 6px;
            box-sizing: border-box;
            gap: 6px;
            justify-content: center;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            flex: 1;
            gap: 6px;
        }

        .key {
            flex: 1;
            background: #ffffff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.1s;
        }

        .key:active {
            background: #9ca3af;
        }

        /* Special key sizings */
        .key.wide {
            flex: 1.5;
            background: #a3aab6;
        }
        .key.space {
            flex: 4;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Display area for notes -->
        <div id="note-area" class="note-area"></div>
        
        <!-- Always-on virtual keyboard -->
        <div class="keyboard" id="keyboard"></div>
    </div>

    <script>
        const noteArea = document.getElementById('note-area');
        let noteText = "";
        let isShift = false;

        // QWERTY Layout arrays
        const layout = [
            ['q','w','e','r','t','y','u','i','o','p'],
            ['a','s','d','f','g','h','j','k','l'],
            ['Shift','z','x','c','v','b','n','m','Bksp'],
            ['Space', 'Enter']
        ];

        const keyboardDiv = document.getElementById('keyboard');

        // Generate Keyboard DOM
        layout.forEach(rowKeys => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'keyboard-row';
            
            rowKeys.forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'key';
                btn.textContent = key;
                
                if (key === 'Shift' || key === 'Bksp') btn.classList.add('wide');
                if (key === 'Space') btn.classList.add('space');
                if (key === 'Enter') btn.classList.add('wide');
                
                // Use pointerdown to handle both mouse clicks and mobile touches instantly
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); // Prevents zoom/scroll side-effects on mobile
                    handleInput(key);
                });

                rowDiv.appendChild(btn);
            });
            keyboardDiv.appendChild(rowDiv);
        });

        // Function to process character input
        function handleInput(key) {
            if (key === 'Bksp') {
                noteText = noteText.slice(0, -1);
            } else if (key === 'Space') {
                noteText += " ";
            } else if (key === 'Enter') {
                noteText += "\n";
            } else if (key === 'Shift') {
                isShift = !isShift;
                return; // Don't print "Shift"
            } else {
                noteText += isShift ? key.toUpperCase() : key;
                if (isShift) isShift = false; // Auto-turn off shift after one letter
            }
            updateNoteArea();
        }

        // Update the screen and auto-scroll to the bottom
        function updateNoteArea() {
            noteArea.textContent = noteText;
            noteArea.scrollTop = noteArea.scrollHeight; 
        }

        // BONUS: Physical Keyboard Support
        // If on a desktop, you can literally just start typing. No clicking required.
        document.addEventListener('keydown', (e) => {
            // Prevent default browser shortcuts from interfering (like spacebar scrolling)
            if(e.key === " " || e.key === "Backspace") {
                e.preventDefault(); 
            }

            if (e.key === 'Backspace') {
                noteText = noteText.slice(0, -1);
            } else if (e.key === 'Enter') {
                noteText += "\n";
            } else if (e.key.length === 1) { // Checks if it's a standard character
                noteText += e.key;
            }
            updateNoteArea();
        });
    </script>
</body>
</html>
