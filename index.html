<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Prevents zooming and ensures edge-to-edge scaling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Notes</title>
    <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
    
            /* Reset and edge-to-edge styling */
                    body, html {
                        margin: 0;
                        padding: 0;
                        height: 100%;
                        width: 100%;
                        font-family: 'Roboto Mono', monospace; 
                        background-color: #2b2d36; /* Dark slate for maximum neumorphic pop */
                        overflow: hidden; 
                        touch-action: none;
                    }
    
            .app-container {
                display: flex;
                flex-direction: column;
                height: 100vh;
                width: 100vw;
            }
    
            /* Top 70% Note Area */
                    .notes-list {
                        flex: 7; 
                        padding: 24px;
                        box-sizing: border-box;
                        background: #2b2d36;
                        overflow-y: auto;
                        border-bottom: 2px solid #1a1c23; /* Subtle dark divider */
                        display: flex;
                        flex-direction: column;
                        gap: 20px;
                    }
            
                    .note-row {
                                                display: flex;
                                                align-items: flex-start;
                                                gap: 16px;
                                                /* Constant Neumorphic pop-out card for the text area */
                                                background: #2b2d36;
                                                padding: 12px;
                                                border-radius: 12px;
                                                box-shadow: -4px -4px 8px rgba(255, 255, 255, 0.06), 4px 4px 8px rgba(0, 0, 0, 0.5);
                                                transition: all 0.1s ease-in-out;
                                            }
                                            
                                            /* Keep it popped out while typing! Just add a subtle red glow to the edges to show it is active */
                                            .note-row:focus-within {
                                                box-shadow: -4px -4px 8px rgba(255, 255, 255, 0.06), 4px 4px 8px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 68, 68, 0.15);
                                            }
                            
                                    .note-input {
                                        flex: 1;
                                        background: transparent;
                                        color: #ff4444; /* Bright red text */
                                        border: none;
                                        outline: none;
                                        font-family: inherit;
                                        font-size: 1.6rem;
                                        font-weight: bold;
                                        line-height: 1.4;
                                        resize: none;
                                        caret-color: #ff4444;
                                        min-height: 2.2rem;
                                        overflow: hidden; 
                                        transition: text-shadow 0.2s;
                                    }
                                    
                                    /* Makes the text itself glow slightly while you are typing */
                                    .note-input:focus {
                                        text-shadow: 0 0 8px rgba(255, 68, 68, 0.4);
                                    }
            
                    .note-input::placeholder {
                        color: #662222; /* Dark red placeholder */
                    }
            
                    /* Neumorphic Delete Button */
                    .note-del-btn {
                        background: #2b2d36;
                        color: #ff4444;
                        border: none;
                        border-radius: 8px;
                        cursor: pointer;
                        font-family: inherit;
                        font-weight: bold;
                        padding: 8px 12px;
                        font-size: 1.2rem;
                        box-shadow: 3px 3px 6px rgba(0,0,0,0.4), -3px -3px 6px rgba(255,255,255,0.06);
                        flex-shrink: 0;
                        transition: all 0.1s ease-in-out;
                    }
                    .note-del-btn:active {
                        color: #ff1111;
                        box-shadow: inset 3px 3px 6px rgba(0,0,0,0.4), inset -3px -3px 6px rgba(255,255,255,0.06);
                    }
    
            /* Bottom 30% Keyboard Area */
                    .keyboard {
                        flex: 3; 
                        background: #2b2d36; 
                        display: flex;
                        flex-direction: column;
                        padding: 12px; 
                        box-sizing: border-box;
                        gap: 12px;
                        justify-content: center;
                    }
            
                    .keyboard-row {
                        display: flex;
                        justify-content: center;
                        flex: 1;
                        gap: 12px;
                    }
            
                    .key {
                        flex: 1;
                        background: #2b2d36; 
                        color: #ff4444; 
                        border: none; 
                        border-radius: 10px; 
                        font-size: 1.3rem;
                        font-weight: bold;
                        cursor: pointer;
                        /* Strong Neumorphic 3D Pop Out Effect */
                        box-shadow: 
                            -4px -4px 8px rgba(255, 255, 255, 0.06), /* White highlight */
                            4px 4px 8px rgba(0, 0, 0, 0.5);          /* Black drop shadow */
                        user-select: none;
                        -webkit-tap-highlight-color: transparent;
                        transition: all 0.1s ease-in-out;
                        font-family: 'Roboto Mono', monospace;
                    }
            
                    .key:active {
                        background: #2b2d36; 
                        color: #ff1111; 
                        /* Pressing the key IN */
                        box-shadow: 
                            inset 4px 4px 8px rgba(0, 0, 0, 0.5),       
                            inset -4px -4px 8px rgba(255, 255, 255, 0.06); 
                    }
            
                    /* Special key sizings */
                    .key.wide {
                        flex: 1.5;
                        /* Removed bg override so it blends perfectly with the neomorph board */
                    }
                    .key.space {
                        flex: 5;
                    }
        /* ===== Font override: JetBrains Mono (sharper, clearer characters) ===== */
                body, html, .note-input, .note-del-btn, .key {
                    font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
                }
                .note-input {
                    letter-spacing: 0.2px;
                }
        
                /* ===== Warm Graphite + Amber palette (low eye-strain for note taking) ===== */
                :root {
                    --bg: #2a2622;
                    --divider: #171411;
                    --accent: #f5b942;
                    --accent-press: #ffd98a;
                    --placeholder: #6e5a36;
                    --hi: rgba(255, 238, 214, 0.06);
                    --lo: rgba(0, 0, 0, 0.55);
                    --glow: rgba(245, 185, 66, 0.2);
                }
                body, html {
                    background-color: var(--bg);
                }
                .notes-list {
                    background: var(--bg);
                    border-bottom: 2px solid var(--divider);
                }
                .note-row {
                    background: var(--bg);
                    box-shadow: -4px -4px 8px var(--hi), 4px 4px 8px var(--lo);
                }
                .note-row:focus-within {
                    box-shadow: -4px -4px 8px var(--hi), 4px 4px 8px var(--lo), 0 0 10px var(--glow);
                }
                .note-input {
                    color: var(--accent);
                    caret-color: var(--accent);
                }
                .note-input:focus {
                    text-shadow: 0 0 8px var(--glow);
                }
                .note-input::placeholder {
                    color: var(--placeholder);
                }
                .note-del-btn {
                    background: var(--bg);
                    color: var(--accent);
                    box-shadow: 3px 3px 6px var(--lo), -3px -3px 6px var(--hi);
                }
                .note-del-btn:active {
                    color: var(--accent-press);
                    box-shadow: inset 3px 3px 6px var(--lo), inset -3px -3px 6px var(--hi);
                }
                .keyboard {
                    background: var(--bg);
                }
                .key {
                    background: var(--bg);
                    color: var(--accent);
                    box-shadow: -4px -4px 8px var(--hi), 4px 4px 8px var(--lo);
                }
                .key:active {
                    background: var(--bg);
                    color: var(--accent-press);
                    box-shadow: inset 4px 4px 8px var(--lo), inset -4px -4px 8px var(--hi);
                }
            </style>
</head>
<body>

    <div class="app-container">
            <!-- Display area for individual notes -->
            <div id="notes-list" class="notes-list"></div>
            
            <!-- Always-on virtual keyboard -->
            <div class="keyboard" id="keyboard"></div>
        </div>

    <script type="module">
                        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
                        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
                
                        const firebaseConfig = {
                            apiKey: "AIzaSyAYHA8Qw3Qw3Qzbyg8MtjrSKcJusNi4VaA6V4",
                            authDomain: "system-data-bf026.firebaseapp.com",
                            databaseURL: "https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app",
                            projectId: "system-data-bf026",
                            storageBucket: "system-data-bf026.firebasestorage.app",
                            messagingSenderId: "718302899022",
                            appId: "1:718302899022:web:f1675dbcc293e138c68c1f"
                        };
                        const app = initializeApp(firebaseConfig);
                                            const db = getDatabase(app);
                                            const noteRef = ref(db, 'terminalKeyboardApp/notesList'); // Changed to Array structure
                                    
                                            const notesListElement = document.getElementById('notes-list');
                                            let activeInput = null;
                                            let notesData = [""]; // Array of notes
                                            
                                            let isShift = false;
                                            let isSymbols = false;
                        
                                            // Function to render the list of notes
                                            function renderNotes() {
                                                notesListElement.innerHTML = '';
                                                if (!notesData || notesData.length === 0) notesData = [""];
                                                
                                                notesData.forEach((text, index) => {
                                                    const row = document.createElement('div');
                                                    row.className = 'note-row';
                                                    
                                                    const textarea = document.createElement('textarea');
                                                    textarea.className = 'note-input';
                                                    textarea.value = text;
                                                    textarea.rows = 1;
                                                    textarea.placeholder = "Tap to type note...";
                                                    textarea.inputMode = "none"; // Hide native keyboard
                                                    
                                                    // Auto-grow feature
                                                    const adjustHeight = () => {
                                                        textarea.style.height = 'auto';
                                                        textarea.style.height = (textarea.scrollHeight) + 'px';
                                                    };
                                                    setTimeout(adjustHeight, 0); // initial adjustment
                                                    
                                                    textarea.addEventListener('input', () => {
                                                        adjustHeight();
                                                        notesData[index] = textarea.value;
                                                        set(noteRef, { notes: notesData });
                                                    });
                        
                                                    textarea.addEventListener('focus', () => {
                                                        activeInput = textarea;
                                                    });
                                                    
                                                    const delBtn = document.createElement('button');
                                                    delBtn.className = 'note-del-btn';
                                                    delBtn.textContent = '⌫';
                                                    delBtn.addEventListener('pointerdown', (e) => {
                                                        e.preventDefault();
                                                        notesData.splice(index, 1);
                                                        if(notesData.length === 0) notesData = [""];
                                                        set(noteRef, { notes: notesData });
                                                        renderNotes(); // Re-render to update index mappings
                                                    });
                                                    
                                                    row.appendChild(textarea);
                                                    row.appendChild(delBtn);
                                                    notesListElement.appendChild(row);
                                                });
                                                
                                                // Set active input to the last one if none is focused
                                                if (!activeInput || !notesListElement.contains(activeInput)) {
                                                    const inputs = document.querySelectorAll('.note-input');
                                                    activeInput = inputs[inputs.length - 1];
                                                }
                                            }
                        
                                            renderNotes(); // Initial render locally
                        
                                            // Keep notes alive with remote Firebase changes
                                            onValue(noteRef, (snapshot) => {
                                                const data = snapshot.val();
                                                if (data && Array.isArray(data.notes)) {
                                                    // Only re-render if the content actually changed to prevent cursor jumps
                                                    if (JSON.stringify(notesData) !== JSON.stringify(data.notes)) {
                                                        notesData = data.notes;
                                                        renderNotes();
                                                    }
                                                } else if (!data) {
                                                    notesData = [""];
                                                    renderNotes();
                                                }
                                            });
                    
                    // Primary Letters Layout
                    const layoutLetters = [
                        ['1','2','3','4','5','6','7','8','9','0'],
                        ['q','w','e','r','t','y','u','i','o','p'],
                        ['spacer', 'a','s','d','f','g','h','j','k','l', 'spacer'],
                        ['Shift','z','x','c','v','b','n','m','Bksp'],
                        ['!#1', ',', 'Space', '.', 'Enter']
                    ];
        
                    // Secondary Symbols Layout
                    const layoutSymbols = [
                        ['1','2','3','4','5','6','7','8','9','0'],
                        ['@','#','$','%','&','-','+','(',')','*'],
                        ['spacer', '"','\'',':',';','!','?','/','~', 'spacer'],
                        ['ABC','_','\\','|','<','>','{','}','Bksp'],
                        ['ABC', ',', 'Space', '.', 'Enter']
                    ];
            
                    const keyboardDiv = document.getElementById('keyboard');
            
                    // Generate Keyboard DOM Dynamically
                    function renderKeyboard() {
                        keyboardDiv.innerHTML = ''; // Clear existing keyboard
                        const currentLayout = isSymbols ? layoutSymbols : layoutLetters;
                        
                        currentLayout.forEach(rowKeys => {
                            const rowDiv = document.createElement('div');
                            rowDiv.className = 'keyboard-row';
                            
                            rowKeys.forEach(key => {
                                if (key === 'spacer') {
                                    const spacer = document.createElement('div');
                                    spacer.style.flex = "0.5";
                                    rowDiv.appendChild(spacer);
                                    return; // Skip adding a button for the spacer
                                }
        
                                const btn = document.createElement('button');
                                btn.className = 'key';
                                
                                // Match the visual icons/text
                                                            if (key === 'Shift') btn.textContent = '⇧';
                                                            else if (key === 'Bksp') btn.textContent = '⌫';
                                                            else if (key === 'Space') btn.textContent = ''; // Hidden spacebar text
                                                            else if (key === 'Enter') btn.textContent = '↵';
                                                            else if (key === 'ABC' || key === '!#1') btn.textContent = key;
                                                            else btn.textContent = (isShift && !isSymbols) ? key.toUpperCase() : key;
                                
                                if (key === 'Shift' || key === 'Bksp' || key === '!#1' || key === 'ABC' || key === 'Enter') {
                                    btn.classList.add('wide');
                                }
                                if (key === 'Space') {
                                    btn.classList.add('space');
                                }
                                
                                // Use pointerdown to handle both mouse clicks and mobile touches instantly
                                btn.addEventListener('pointerdown', (e) => {
                                    e.preventDefault(); // Crucial: Prevents button from stealing focus from the textarea cursor
                                    handleInput(key);
                                });
                
                                rowDiv.appendChild(btn);
                            });
                            keyboardDiv.appendChild(rowDiv);
                        });
                    }
        
                    renderKeyboard(); // Render the keyboard immediately on load
            
                    // Function to process character input at cursor position
                                        function handleInput(key) {
                                            if (!activeInput || !notesListElement.contains(activeInput)) {
                                                const inputs = document.querySelectorAll('.note-input');
                                                activeInput = inputs[inputs.length - 1];
                                            }
                                            if (!activeInput) return;
                                            
                                            activeInput.focus(); // Ensure textarea is active
                                            const start = activeInput.selectionStart;
                                            const end = activeInput.selectionEnd;
                                            const val = activeInput.value;
                                            let textToInsert = "";
                                
                                            if (key === 'Bksp') {
                                                if (start === end && start > 0) {
                                                    activeInput.value = val.substring(0, start - 1) + val.substring(end);
                                                    activeInput.selectionStart = activeInput.selectionEnd = start - 1;
                                                } else if (start !== end) {
                                                    activeInput.value = val.substring(0, start) + val.substring(end);
                                                    activeInput.selectionStart = activeInput.selectionEnd = start;
                                                } else if (start === 0 && notesData.length > 1 && val === "") {
                                                    // If backspace on an empty line, delete the whole line automatically!
                                                    const index = Array.from(notesListElement.children).indexOf(activeInput.parentElement);
                                                    notesData.splice(index, 1);
                                                    set(noteRef, { notes: notesData });
                                                    renderNotes();
                                                    
                                                    // Focus the previous note
                                                    const inputs = document.querySelectorAll('.note-input');
                                                    activeInput = inputs[Math.max(0, index - 1)];
                                                    activeInput.focus();
                                                    activeInput.selectionStart = activeInput.selectionEnd = activeInput.value.length; // Move cursor to end
                                                }
                                                
                                                // Trigger resize
                                                activeInput.style.height = 'auto';
                                                activeInput.style.height = (activeInput.scrollHeight) + 'px';
                                                
                                                // Save
                                                const idx = Array.from(notesListElement.children).indexOf(activeInput.parentElement);
                                                if (idx >= 0) {
                                                    notesData[idx] = activeInput.value;
                                                    set(noteRef, { notes: notesData });
                                                }
                                                return; // Skip the insertion step
                                            } else if (key === 'Space') {
                                                textToInsert = " ";
                                            } else if (key === 'Enter') {
                                                // Create a new note line!
                                                const index = Array.from(notesListElement.children).indexOf(activeInput.parentElement);
                                                notesData.splice(index + 1, 0, "");
                                                set(noteRef, { notes: notesData });
                                                renderNotes();
                                                
                                                // Focus the new note line
                                                const inputs = document.querySelectorAll('.note-input');
                                                activeInput = inputs[index + 1];
                                                activeInput.focus();
                                                return; // Skip normal insertion
                                            } else if (key === 'Shift') {
                                                isShift = !isShift;
                                                renderKeyboard(); // Re-render to show uppercase/lowercase keys
                                                return; // Toggle shift and exit
                                            } else if (key === '!#1' || key === 'ABC') {
                                                isSymbols = !isSymbols; // Toggle layout state
                                                if (isSymbols) isShift = false; // Reset shift when opening symbols
                                                renderKeyboard(); // Re-render with new layout
                                                return;
                                            } else {
                                                textToInsert = (isShift && !isSymbols) ? key.toUpperCase() : key;
                                                if (isShift) {
                                                    isShift = false; // Auto-turn off shift after one letter
                                                    renderKeyboard(); // Re-render back to lowercase
                                                }
                                            }
                                
                                            // Insert exactly at current cursor position
                                            activeInput.value = val.substring(0, start) + textToInsert + val.substring(end);
                                            activeInput.selectionStart = activeInput.selectionEnd = start + textToInsert.length;
                                            
                                            // Trigger resize
                                            activeInput.style.height = 'auto';
                                            activeInput.style.height = (activeInput.scrollHeight) + 'px';
                                            
                                            // Push to Firebase instantly
                                            const index = Array.from(notesListElement.children).indexOf(activeInput.parentElement);
                                            notesData[index] = activeInput.value;
                                            set(noteRef, { notes: notesData });
                                        }
                                    </script>
</body>
</html>
